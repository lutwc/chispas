<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Te amo ♡</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, sans-serif;
}

/* =========================
   PANTALLA INICIAL
========================= */

#inicio {
    position: fixed;
    inset: 0;
    z-index: 1000;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}

#videoFondo {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
}

#botonInicio {
    position: relative;
    z-index: 2;
    padding: 16px 42px;
    border: none;
    border-radius: 18px;
    background: rgba(255, 102, 119, 0.82);
    color: white;
    font-size: 22px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 8px 25px rgba(0,0,0,0.25);
    transition: transform 0.25s ease, background 0.25s ease;
}

#botonInicio:hover {
    transform: scale(1.08);
    background: rgba(255, 82, 105, 0.95);
}

/* =========================
   MENSAJE INTERMEDIO
========================= */

#mensaje {
    position: fixed;
    inset: 0;
    z-index: 900;
    display: none;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    text-align: center;
    color: white;

    background:
        radial-gradient(
            circle at center,
            #ff9eae 0%,
            #ff8297 45%,
            #ff667f 100%
        );

    overflow: hidden;
}

#mensaje h1 {
    position: relative;
    z-index: 2;
    font-size: clamp(35px, 8vw, 80px);
    margin-bottom: 15px;
    text-shadow:
        0 4px 15px rgba(0,0,0,0.15),
        0 0 25px rgba(255,255,255,0.55);
}

#mensaje p {
    position: relative;
    z-index: 2;
    font-size: clamp(18px, 4vw, 30px);
    text-shadow: 0 3px 10px rgba(0,0,0,0.12);
}

/* =========================
   CONFETI
========================= */

.confeti {
    position: fixed;
    width: 10px;
    height: 15px;
    top: -20px;
    z-index: 2000;
    animation: caerConfeti linear forwards;
    pointer-events: none;
}

@keyframes caerConfeti {
    to {
        transform: translateY(110vh) rotate(720deg);
    }
}

/* =========================
   PÁGINA FINAL
========================= */

#final {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: none;
    overflow: hidden;

    background-image: url("superfondo.jpg");
    background-size: cover;
    background-position: center;

    /* MARCO */
    border: 10px solid rgba(255, 245, 250, 0.95);

    box-shadow:
        inset 0 0 0 4px #ff86a5,
        inset 0 0 0 8px rgba(255,255,255,0.9),
        0 0 35px rgba(255,105,145,0.55);
}

/* capa suave para integrar decoración */
#final::before {
    content: "";
    position: absolute;
    inset: 0;

    background: rgba(255, 182, 202, 0.08);

    pointer-events: none;
    z-index: 5;
}

/* =========================
   DECORACIONES ALREDEDOR
   DE LA CARTA
========================= */

.decoracionCarta {
    position: absolute;
    inset: 0;
    z-index: 75;
    pointer-events: none;
    overflow: hidden;
}

.decoracionCarta span {

    color: white;
    font-weight: bold;

    filter:
        drop-shadow(0 0 5px rgba(255,255,255,0.95))

.dc8 {

@keyframes decorarCarta {

    }

    50% {
        transform: scale(1.2) rotate(8deg);

    }

/* =========================
   TARJETA
========================= */

.card {
    position: absolute;
    z-index: 80;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);

    width: min(58vw, 570px);
    min-height: 270px;
    padding: 45px 38px;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;

    background: rgba(255, 245, 248, 0.90);

    border: 3px solid rgba(255,255,255,0.9);
    border-radius: 30px;

    box-shadow:
        0 15px 50px rgba(80, 20, 40, 0.25),
        0 0 30px rgba(255,255,255,0.35),
        0 0 45px rgba(255,105,145,0.25);

    backdrop-filter: blur(5px);
}

/* =========================
   FUENTE LINDA Y BRILLANTE
========================= */

.card h1 {
    font-family:
        "Trebuchet MS",
        Arial,
        sans-serif;

    font-weight: 900;
    letter-spacing: 0.5px;

    font-size: clamp(25px, 4vw, 42px);
    margin-bottom: 22px;

    background:
        linear-gradient(
            120deg,
            #d93668,
            #ff6f91,
            #ffb6c9,
            #e94f78,
            #c93665
        );

    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;

    text-shadow:
        0 2px 8px rgba(255,105,145,0.3),
        0 0 12px rgba(255,255,255,0.8);
}

.card p {
    font-family:
        "Trebuchet MS",
        Arial,
        sans-serif;

    font-weight: 700;
    letter-spacing: 0.2px;

    color: #70404e;
    font-size: clamp(17px, 2vw, 22px);
    line-height: 1.6;

    text-shadow:
        0 1px 5px rgba(255,255,255,0.8);
}

.card::before {
    content: "✦";
    position: absolute;
    top: -22px;
    left: 12%;
    font-size: 22px;
    color: white;
    animation: brillito 2s ease-in-out infinite;
    filter: drop-shadow(0 0 7px rgba(255,255,255,0.9));
}

.card::after {
    content: "♡";
    position: absolute;
    bottom: -24px;
    right: 12%;
    font-size: 27px;
    color: white;
    animation: brillito 2.5s ease-in-out infinite;
    filter: drop-shadow(0 0 7px rgba(255,255,255,0.9));
}

@keyframes brillito {
    0%, 100% {
        opacity: 0.4;
        transform: scale(0.8) rotate(-10deg);
    }

    50% {
        opacity: 1;
        transform: scale(1.2) rotate(10deg);
    }
}

/* =========================
   CORAZÓN ARRIBA DE LA CARTITA
========================= */

.corazonTitulo {
    position: absolute;
    z-index: 90;
    left: 50%;
    top: calc(50% - 205px);
    transform: translateX(-50%);

    color: #ff6f91;
    font-size: clamp(42px, 6vw, 68px);

    text-shadow:
        0 0 5px #fff,
        0 0 12px #ff9db5,
        0 0 25px #ff6f91,
        0 0 40px rgba(255, 105, 145, 0.8);

    animation: corazonLate 1.25s ease-in-out infinite;
}

.corazonTitulo::before,
.corazonTitulo::after {
    position: absolute;
    color: white;
    font-size: 15px;
    text-shadow:
        0 0 7px white,
        0 0 12px #ff9db5;
    animation: miniBrillo 1.2s ease-in-out infinite;
}

.corazonTitulo::before {
    content: "✦";
    left: -23px;
    top: 5px;
}

.corazonTitulo::after {
    content: "✧";
    right: -23px;
    bottom: 4px;
    animation-delay: 0.4s;
}

@keyframes corazonLate {
    0%, 100% {
        transform: translateX(-50%) scale(1);
    }

    15% {
        transform: translateX(-50%) scale(1.12);
    }

    30% {
        transform: translateX(-50%) scale(0.98);
    }

    45% {
        transform: translateX(-50%) scale(1.08);
    }

    60% {
        transform: translateX(-50%) scale(1);
    }
}

@keyframes miniBrillo {
    0%, 100% {
        opacity: 0.35;
        transform: scale(0.7) rotate(0deg);
    }

    50% {
        opacity: 1;
        transform: scale(1.35) rotate(20deg);
    }
}

========================= */

@keyframes flotarDecoracion {
    0%, 100% {

/* =========================
   GATO 2 - ASOMADO
========================= */

#gatoAsomado {
    position: fixed;
    width: 100px;
    height: auto;
    z-index: 1500;
    display: none;
    pointer-events: none;
    will-change: transform;
}

/* izquierda - gira 90° hacia adentro */
#gatoAsomado.izquierda {
    left: 0;
    top: 50%;

    transform:
        translate(-110%, -50%)
        rotate(90deg)
        scaleX(-1);

    animation:
        gatoIzquierdaEntrada 1.3s ease-out forwards,
        gatoIzquierdaSalida 1.3s ease-in 1.8s forwards;
}

@keyframes gatoIzquierdaEntrada {
    from {
        transform:
            translate(-110%, -50%)
            rotate(90deg)
            scaleX(-1);
    }

    to {
        transform:
            translate(0, -50%)
            rotate(90deg)
            scaleX(-1);
    }
}

@keyframes gatoIzquierdaSalida {
    from {
        transform:
            translate(0, -50%)
            rotate(90deg)
            scaleX(-1);
    }

    to {
        transform:
            translate(-110%, -50%)
            rotate(90deg)
            scaleX(-1);
    }
}

/* derecha - gira 90° hacia adentro */
#gatoAsomado.derecha {
    right: 0;
    top: 50%;

    transform:
        translate(110%, -50%)
        rotate(-90deg);

    animation:
        gatoDerechaEntrada 1.3s ease-out forwards,
        gatoDerechaSalida 1.3s ease-in 1.8s forwards;
}

@keyframes gatoDerechaEntrada {
    from {
        transform:
            translate(110%, -50%)
            rotate(-90deg);
    }

    to {
        transform:
            translate(0, -50%)
            rotate(-90deg);
    }
}

@keyframes gatoDerechaSalida {
    from {
        transform:
            translate(0, -50%)
            rotate(-90deg);
    }

    to {
        transform:
            translate(110%, -50%)
            rotate(-90deg);
    }
}

/* arriba */
#gatoAsomado.arriba {
    top: 0;
    left: 50%;
    transform:
        translate(-50%, -110%)
        scaleY(-1);

    animation:
        gatoArribaEntrada 1.3s ease-out forwards,
        gatoArribaSalida 1.3s ease-in 1.8s forwards;
}

@keyframes gatoArribaEntrada {
    from {
        transform:
            translate(-50%, -110%)
            scaleY(-1);
    }

    to {
        transform:
            translate(-50%, 0)
            scaleY(-1);
    }
}

@keyframes gatoArribaSalida {
    from {
        transform:
            translate(-50%, 0)
            scaleY(-1);
    }

    to {
        transform:
            translate(-50%, -110%)
            scaleY(-1);
    }
}

/* abajo */
#gatoAsomado.abajo {
    bottom: 0;
    left: 50%;
    transform:
        translate(-50%, 110%);

    animation:
        gatoAbajoEntrada 1.3s ease-out forwards,
        gatoAbajoSalida 1.3s ease-in 1.8s forwards;
}

@keyframes gatoAbajoEntrada {
    from {
        transform:
            translate(-50%, 110%);
    }

    to {
        transform:
            translate(-50%, 0);
    }
}

@keyframes gatoAbajoSalida {
    from {
        transform:
            translate(-50%, 0);
    }

    to {
        transform:
            translate(-50%, 110%);
    }
}

/* =========================
   VIDEOS LATERALES
========================= */

.videoLateral {
    position: absolute;
    z-index: 70;
    width: clamp(90px, 15vw, 190px);
    height: clamp(90px, 15vw, 190px);
    object-fit: cover;
    border-radius: 22px;

    box-shadow:
        0 8px 25px rgba(0,0,0,0.25),
        0 0 15px rgba(255,255,255,0.45);

    transition:
        transform 0.3s ease,
        box-shadow 0.3s ease,
        filter 0.3s ease;
}

/* efecto brillito al tocar/pasar */
.videoLateral:hover,
.videoLateral:active {
    transform: scale(1.08);

    filter:
        brightness(1.12)
        drop-shadow(0 0 8px rgba(255,255,255,0.9));

    box-shadow:
        0 10px 30px rgba(0,0,0,0.3),
        0 0 12px rgba(255,255,255,0.9),
        0 0 25px rgba(255,150,190,0.85),
        0 0 45px rgba(255,255,255,0.55);
}

/* pequeños destellos */
.videoLateral:hover::before,
.videoLateral:active::before {
    content: "✦";
    position: absolute;
    z-index: 100;
    top: -12px;
    right: -12px;
    color: white;
    font-size: 20px;
    text-shadow:
        0 0 5px white,
        0 0 12px #ff8fac;
    animation: brilloGif 0.7s ease-in-out infinite alternate;
}

@keyframes brilloGif {
    from {
        transform: scale(0.7) rotate(0deg);
        opacity: 0.4;
    }

    to {
        transform: scale(1.25) rotate(20deg);
        opacity: 1;
    }
}

<audio id="cancion" src="cancion.mp3" loop></audio>


<script>

/* =========================
   ELEMENTOS
========================= */

const inicio = document.getElementById("inicio");
const botonInicio = document.getElementById("botonInicio");
const mensaje = document.getElementById("mensaje");
const final = document.getElementById("final");

const confeti = document.getElementById("confeti");
const musica = document.getElementById("musica");
const tin = document.getElementById("tin");
const cancion = document.getElementById("cancion");

const gatoAsomado = document.getElementById("gatoAsomado");

const easterEgg = document.getElementById("easterEgg");
const gatoQ = document.getElementById("gatoQ");
const gato3Video = document.getElementById("gato3Video");

const gif5 = document.getElementById("gif5");

let gatoTimer;
let easterEggActivado = false;


/* =========================
   BOTÓN INICIAL
========================= */

botonInicio.addEventListener("click", () => {

    inicio.style.display = "none";

    mensaje.style.display = "flex";

    confeti.currentTime = 0;
    confeti.play().catch(() => {});

    crearConfeti();

    setTimeout(() => {

        mensaje.style.display = "none";

        final.style.display = "block";

        musica.currentTime = 5;
        musica.play().catch(() => {});

        esperarParaGato();

    }, 4500);

});


/* =========================
   CONFETI
========================= */

function crearConfeti() {

    const simbolos = ["♥", "♡", "✦", "✧", "●"];

    const colores = [
        "#ff1744",
        "#ff4081",
        "#ff80ab",
        "#ffd166",
        "#06d6a0",
        "#4cc9f0",
        "#b388ff",
        "#ffffff"
    ];

    for (let i = 0; i < 180; i++) {

        const pieza = document.createElement("div");

        pieza.className = "confeti";

        pieza.textContent =
            simbolos[Math.floor(Math.random() * simbolos.length)];

        pieza.style.left =
            Math.random() * 100 + "vw";

        pieza.style.color =
            colores[Math.floor(Math.random() * colores.length)];

        pieza.style.animationDuration =
            (2 + Math.random() * 3) + "s";

        pieza.style.animationDelay =
            Math.random() * 1.5 + "s";

        pieza.style.fontSize =
            (8 + Math.random() * 15) + "px";

        mensaje.appendChild(pieza);

        setTimeout(() => {
            pieza.remove();
        }, 6000);
    }
}


/* =========================
   GIF5
========================= */

gif5.addEventListener("timeupdate", () => {

    if (gif5.currentTime >= 14) {
        gif5.currentTime = 0;
        gif5.play().catch(() => {});
    }

});


/* =========================
   GATO ASOMADO
========================= */

function esperarParaGato() {

    if (easterEggActivado) return;

    const tiempo =
        2000 + Math.random() * 2000;

    gatoTimer = setTimeout(asomarGato, tiempo);

}


function asomarGato() {

    if (easterEggActivado) return;

    const lados = [
        "izquierda",
        "derecha",
        "arriba",
        "abajo"
    ];

    const lado =
        lados[Math.floor(Math.random() * lados.length)];

    gatoAsomado.className = lado;

    gatoAsomado.style.display = "block";

    gatoAsomado.style.pointerEvents = "auto";


    /*
       1.3 segundos entrando
       1.8 segundos quieto
       1.3 segundos saliendo
       = 4.4 segundos
    */

    setTimeout(() => {

        if (easterEggActivado) return;

        gatoAsomado.style.display = "none";

        gatoAsomado.className = "";

        gatoAsomado.style.pointerEvents = "none";

        esperarParaGato();

    }, 4400);

}


/* =========================
   EASTER EGG
========================= */

gatoAsomado.addEventListener(
    "pointerdown",
    activarEasterEgg
);


function activarEasterEgg(event) {

    if (easterEggActivado) return;

    easterEggActivado = true;

    event.preventDefault();

    clearTimeout(gatoTimer);


    /* esconder gato2 */

    gatoAsomado.style.display = "none";
    gatoAsomado.style.pointerEvents = "none";
    gatoAsomado.className = "";


    /* detener música */

    musica.pause();
    musica.currentTime = 0;


    /* activar pantalla negra */

    easterEgg.style.display = "flex";

    requestAnimationFrame(() => {

        easterEgg.classList.add("activo");

    });


    /*
       3 segundos para oscurecer
       + 5 segundos completamente negro
       = 8 segundos
    */

    setTimeout(() => {

        gatoQ.style.display = "block";

        easterEgg.classList.add("mostrarGatoQ");

        tin.currentTime = 0;
        tin.play().catch(() => {});

    }, 8000);


    /*
       2.5 segundos después aparece gato3
    */

    setTimeout(() => {

        easterEgg.classList.remove("mostrarGatoQ");

        gatoQ.style.display = "none";


        gato3Video.currentTime = 0;
        gato3Video.muted = true;
        gato3Video.loop = true;

        easterEgg.classList.add("mostrarGato3");

        gato3Video.play().catch(() => {});


        cancion.currentTime = 0;
        cancion.loop = true;

        cancion.play().catch(() => {});

    }, 10500);

}

</script>
